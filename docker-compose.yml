services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kakeibo
      POSTGRES_PASSWORD: kakeibo_dev
      POSTGRES_DB: kakeibo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  ui:
    build: ./ui
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

  mlflow:
    build: ./mlflow
    ports:
      - "5001:5000"
    volumes:
      - ./mlflow/data:/mlflow
    restart: unless-stopped

volumes:
  postgres_data: